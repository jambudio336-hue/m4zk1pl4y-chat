name: Build Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Production API URL (https://...)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: TypeScript check
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json
      - name: Supabase Edge Function type check
        run: deno check supabase/functions/m4zk-api/index.ts
      - name: Validate backend JavaScript syntax
        run: find apps/server/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Configure API URL
        env:
          API_URL_INPUT: ${{ github.event.inputs.api_url }}
          API_URL_VAR: ${{ vars.M4ZK_API_URL }}
        run: |
          API_URL="${API_URL_INPUT:-$API_URL_VAR}"
          if [ -z "$API_URL" ]; then
            API_URL="https://fscqhvqzecqjkllwiuga.supabase.co/functions/v1/m4zk-api"
          fi
          case "$API_URL" in https://*) ;; *) echo "API URL must use HTTPS"; exit 1 ;; esac
          echo "EXPO_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure release signing
        working-directory: apps/mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release keystore configured; using Expo's default debug signing for installable test APK."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          printf '\nMZK_STORE_FILE=release.keystore\nMZK_KEY_ALIAS=%s\nMZK_STORE_PASSWORD=%s\nMZK_KEY_PASSWORD=%s\n' "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" >> android/gradle.properties
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(/signingConfigs\s*\{/, `signingConfigs {
              release {
                  storeFile file(MZK_STORE_FILE)
                  storePassword MZK_STORE_PASSWORD
                  keyAlias MZK_KEY_ALIAS
                  keyPassword MZK_KEY_PASSWORD
              }`);
          s = s.replace(/signingConfig\s+signingConfigs\.debug/, 'signingConfig signingConfigs.release');
          fs.writeFileSync(p, s);
          NODE
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -x lint --no-daemon
      - name: Stage APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/m4zk1pl4y-${{ github.run_number }}.apk"
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: m4zk1pl4y-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
