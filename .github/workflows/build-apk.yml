name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL API produksi (https://...)'
        required: true
        default: 'https://api.m4zk1pl4y.example'
  push:
    tags:
      - 'v*'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native project
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://api.m4zk1pl4y.example' }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            echo "MZK_STORE_FILE=release.keystore"
            echo "MZK_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "MZK_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "MZK_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/gradle.properties
          node -e "
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace(/signingConfigs\s*\{/, \`signingConfigs {
              release {
                  storeFile file(MZK_STORE_FILE)
                  storePassword MZK_STORE_PASSWORD
                  keyAlias MZK_KEY_ALIAS
                  keyPassword MZK_KEY_PASSWORD
              }\`);
          s = s.replace(/signingConfig\s+signingConfigs\.debug/, 'signingConfig signingConfigs.release');
          fs.writeFileSync(p, s);
          "

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://api.m4zk1pl4y.example' }}
        run: ./gradlew assembleRelease -x lint --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/m4zk1pl4y-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m4zk1pl4y-apk
          path: out/*.apk
          retention-days: 30
